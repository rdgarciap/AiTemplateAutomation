<h1 id="la-brecha-ia-en-el-negocio-vs-ia-en-qa">La Brecha: IA en el Negocio vs. IA en QA</h1>
<blockquote>
<p>Los equipos de desarrollo ya usan IA (Copilot, ChatGPT) para escribir código.<br />
<strong>¿Por qué el proceso de QA continúa siendo 100% manual o scriptado a mano?</strong></p>
</blockquote>
<div class="columns">
<div>
<p><strong>Sin IA en QA:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-gherkin"><span class="hljs-comment"># El QA escribe el feature...</span>
<span class="hljs-keyword">When</span> I instruct the AI to <span class="hljs-string">&quot;navigate to login&quot;</span>
<span class="hljs-comment"># ...y TAMBIÉN debe:</span>
<span class="hljs-comment"># - escribir el selector CSS exacto</span>
<span class="hljs-comment"># - mantenerlo si cambia la UI</span>
<span class="hljs-comment"># - re-ejecutar manualmente si falla</span>
</code></pre>
</div>
<div>
<p><strong>Con IA en QA:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-gherkin"><span class="hljs-comment"># El QA solo describe la intención:</span>
<span class="hljs-keyword">When</span> I instruct the AI to <span class="hljs-string">&quot;navigate to login&quot;</span>

<span class="hljs-comment"># El orquestador IA resuelve:</span>
<span class="hljs-comment"># → skill: Browser</span>
<span class="hljs-comment"># → function: NavigateTo</span>
<span class="hljs-comment"># → args: { &quot;url&quot;: &quot;/login&quot; }</span>
</code></pre>
</div>
</div>
<p><strong>El template que presentamos cierra esta brecha.</strong></p>

<h1 id="%C2%BFqu%C3%A9-es-aitemplateautomation">¿Qué es AiTemplateAutomation?</h1>
<p>Un <strong>template de framework BDD con orquestación IA</strong>, listo para ser utilizado directamente por el QA.</p>
<div class="columns">
<div>
<p><strong>Lo que es:</strong></p>
<ul>
<li>Un template generador (<code>bootstrap-template.ps1</code>)</li>
<li>Un framework de pruebas con arquitectura definida</li>
<li>Una colección de skills reutilizables (Browser, API, Database)</li>
<li>Un contrato técnico documentado (prompts/)</li>
<li>Integración nativa con AWS (SSO, Secrets Manager)</li>
</ul>
</div>
<div>
<p><strong>Lo que NO es:</strong></p>
<ul>
<li>Un proyecto de pruebas específico de un sistema</li>
<li>Un reemplazo de criterios de aceptación del negocio</li>
<li>Una solución mágica sin configuración</li>
<li>Una herramienta que requiere conocer IA profundamente</li>
</ul>
</div>

<td>Por escenario</td>

<td>Por escenario</td>
</tr>

<h1 id="lifecycle-por-escenario">Lifecycle por Escenario</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Gherkin: Scenario: Verificar saldo de cuenta
          │
          ▼
 [BeforeScenario]
  1. new ConfigurationDriver()      ← lee appsettings.json + EnvVars
  2. new AiContext()                ← estado vacío
  3. AwsSecretsManagerDriver        ← prepara acceso a secretos
  4. Kernel.CreateBuilder()         ← construye orquestador IA
  5. BrowserSkill + ApiSkill        ← registra plugins base
  6. DatabaseSkill (si DB válida)   ← registra plugin DB (condicional)
          │
          ▼
 [Steps execution]
  When I instruct the AI to &quot;...&quot;  → AiOrchestratorSteps
  When I execute the SQL query     → DatabaseStepDefinitions
  Then the AI action should succeed
          │
          ▼
 [AfterScenario]
  - Libera browser/driver UI
  - Cierra conexiones abiertas
  - Limpia recursos externos
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-background-color="#0f1117" data-color="#e8eaf6" data-class="divider" data-theme="default" data-style="section {

<h1 id="por-qu%C3%A9-este-stack">Por Qué Este Stack</h1>
<div class="columns">
<div>
<p><strong>Reqnroll + NUnit</strong></p>
<ul>
<li>Sucesor oficial de SpecFlow (mismos autores)</li>
<li>Living documentation: el feature file ES la especificación</li>
<li>Detectado nativamente por Visual Studio y riders CI/CD</li>
</ul>
<p><strong>Semantic Kernel</strong></p>
<ul>
<li>SDK oficial de Microsoft para LLM en .NET</li>
<li>Soporte nativo OpenAI <strong>y</strong> Azure OpenAI</li>
<li>Plugins tipados con descripción → el LLM entiende cuándo usarlos</li>
<li>Temperatura <code>0.0</code> → comportamiento reproducible</li>
</ul>
</div>
<div>
<p><strong>AWS SDK + SSO</strong></p>
<ul>
<li>Gestión de credenciales sin secrets en código</li>
<li>Compatibilidad con el estándar corporativo de GBM</li>
<li>Soporte para credenciales temporales (rotación automática)</li>
<li>Resolución de connection strings desde Secrets Manager</li>

<h1 id="seguridad-aws-secrets-manager">Seguridad: AWS Secrets Manager</h1>
<p><strong>Problema:</strong> Las connection strings y API keys no deben vivir en código ni en <code>appsettings.json</code> en producción.</p>
<p><strong>Solución del template:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>appsettings.json  ←  placeholder solamente
     │
     ▼ (si hay secreto configurado)
AWS Secrets Manager  →  AwsSecretsManagerDriver  →  connection string en memoria
     │
     ▼
DatabaseSkill usa la connection string resuelta
(nunca expuesta en logs ni variables de entorno)
</code></pre>
<p><strong>Flujo de autenticación:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>AWS SSO (IAM Identity Center)
  → aws sso login --profile PERFIL-GBM
  → Credenciales temporales (8 horas)
  → AwsCredentialsProvider (caché en memoria)
  → AmazonSecretsManagerClient autenticado
  → GetSecretValueAsync(&quot;/gbm/proyecto/sqlserver-credentials&quot;)
</code></pre>
<blockquote>
<p><strong>El secret nunca toca disco.</strong> Solo existe en memoria durante la ejecución del escenario.</p>
</blockquote>

<h1 id="configuraci%C3%B3n-aws-en-appsettingsjson">Configuración AWS en <code>appsettings.json</code></h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-json"><span class="hljs-punctuation">{</span>
  <span class="hljs-attr">&quot;AWSSettings&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-punctuation">{</span>
    <span class="hljs-attr">&quot;Region&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;us-east-1&quot;</span><span class="hljs-punctuation">,</span>
    <span class="hljs-attr">&quot;Profile&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;GBM-DEV&quot;</span><span class="hljs-punctuation">,</span>
    <span class="hljs-attr">&quot;Secrets&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-punctuation">{</span>
      <span class="hljs-attr">&quot;SobConnectionString&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;/gbm/mi-proyecto/sqlserver-credentials&quot;</span>
    <span class="hljs-punctuation">}</span>
  <span class="hljs-punctuation">}</span><span class="hljs-punctuation">,</span>
  <span class="hljs-attr">&quot;DatabaseSettings&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-punctuation">{</span>
    <span class="hljs-attr">&quot;Provider&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;SqlServer&quot;</span><span class="hljs-punctuation">,</span>
    <span class="hljs-attr">&quot;TimeoutSeconds&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-number">30</span><span class="hljs-punctuation">,</span>
    <span class="hljs-attr">&quot;UseTransactionByDefault&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-literal"><span class="hljs-keyword">false</span></span><span class="hljs-punctuation">,</span>
    <span class="hljs-attr">&quot;ConnectionString&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;&quot;</span>
  <span class="hljs-punctuation">}</span>
<span class="hljs-punctuation">}</span>
</code></pre>
<p><strong>Prioridad de resolución de la connection string:</strong></p>
<ol>
<li>Secreto de AWS Secrets Manager (si <code>SobConnectionString</code> tiene valor)</li>
<li><code>DatabaseSettings:ConnectionString</code> directo (para local/dev sin AWS)</li>
<li>Si ninguno: <code>DatabaseSkill</code> <strong>no se registra</strong> (falla silenciosa, no rompe el resto)</li>
</ol>

<h1 id="beneficios-para-el-equipo-de-qa">Beneficios para el Equipo de QA</h1>
<div class="columns">
<div>
<p><strong>Productividad</strong></p>

<li>Reutilización de steps entre proyectos (mismo framework)</li>
<li><code>bootstrap-template.ps1</code> genera un proyecto listo en &lt; 2 minutos</li>
</ul>
<p><strong>Calidad</strong></p>
<ul>
<li>StyleCop + FXCop aplica estándares automáticamente</li>
<li>Código autodocumentado (XML docs obligatorios)</li>
<li>Tests reproducibles en CI/CD (temperatura <code>0.0</code>)</li>
<li>Cobertura de API, UI y BD en el mismo framework</li>
</ul>
</div>
<div>
<p><strong>Mantenibilidad</strong></p>
<ul>
<li>Separación clara: el feature describe QUÉ, la IA decide CÓMO</li>

<li>Cambiar de SQL Server a PostgreSQL: 1 línea en <code>appsettings.json</code></li>
<li>Skills extensibles sin modificar el core</li>

<h1 id="aplicabilidad-en-gbm">Aplicabilidad en GBM</h1>
<table>
<thead>
<tr>
<th>Dominio</th>
<th>Tipo de prueba</th>
<th>Skills utilizadas</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Trading / Órdenes</strong></td>
<td>Validación de APIs de ejecución</td>
<td><code>Api.GetRequest</code>, <code>Api.ValidateJsonSchema</code></td>
</tr>
<tr>
<td><strong>Portal del Cliente</strong></td>
<td>Flujos de UI (login, portafolio, transferencias)</td>
<td><code>Browser.NavigateTo</code>, <code>Browser.FillField</code></td>
</tr>
<tr>
<td><strong>Reportes y Consultas</strong></td>
<td>Verificación de datos en BD</td>
<td><code>Database.ExecuteQuery</code></td>
</tr>
<tr>
<td><strong>Operaciones nocturnas</strong></td>
<td>Validación post-proceso batch</td>
<td><code>Database.ExecuteScriptFile</code></td>
</tr>
<tr>
<td><strong>Onboarding Digital</strong></td>
<td>Flujo completo E2E (UI + API + BD)</td>
<td>Todas las skills</td>
</tr>
<tr>
<td><strong>Conciliación</strong></td>
<td>Comparación DB vs respuesta API</td>
<td><code>Api</code> + <code>Database</code> en mismo escenario</td>
</tr>
<tr>
<td><strong>CI/CD gates</strong></td>
<td>Smoke tests automáticos antes de deploy</td>
<td><code>@smoke</code> tagged scenarios</td>
</tr>
</tbody>
</table>
<p><strong>Ejemplo de escenario E2E real:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-gherkin"><span class="hljs-meta">@e2e</span> <span class="hljs-meta">@trading</span>
<span class="hljs-keyword">Scenario</span>: Verificar que una orden de compra se registra correctamente
  <span class="hljs-keyword">When</span> I instruct the AI to <span class="hljs-string">&quot;post to https://api.gbm.com/orders with body {\&quot;symbol\&quot;:\&quot;AMXL\&quot;,\&quot;qty\&quot;:100}&quot;</span>
  <span class="hljs-keyword">Then</span> the AI action should succeed
  <span class="hljs-keyword">When</span> I execute the SQL query <span class="hljs-string">&quot;SELECT * FROM Orders WHERE Symbol=&#x27;AMXL&#x27; AND Status=&#x27;PENDING&#x27;&quot;</span> with parameters
    |<span class="hljs-string"> Name   </span>|<span class="hljs-string"> Value </span>|
    |<span class="hljs-string"> Symbol </span>|<span class="hljs-string"> AMXL  </span>|
  <span class="hljs-keyword">Then</span> the database query should return at least 1 row
</code></pre>
</section>

<h1 id="riesgos-identificados">Riesgos Identificados</h1>
<table>
<thead>
<tr>
<th>Riesgo</th>
<th>Probabilidad</th>
<th>Impacto</th>
<th>Mitigación</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>LLM retorna JSON inválido</strong></td>
<td>Media</td>
<td>Alto</td>
<td>Validación estricta antes de <code>InvokeAsync</code> + mensaje diagnóstico con payload original</td>
</tr>
<tr>
<td><strong>Costo de API OpenAI/Azure</strong></td>
<td>Alta (si mal uso)</td>
<td>Medio</td>
<td>Temperatura <code>0.0</code>, tokens limitados a 500, los pasos directos NO usan LLM</td>
</tr>
<tr>
<td><strong>Expiración de sesión AWS SSO</strong></td>
<td>Alta (cada 8h)</td>
<td>Alto</td>
<td><code>AwsSessionValidator</code> valida antes de ejecutar tests; documentación de renovación incluida</td>
</tr>
<tr>
<td><strong>Token VSTS expirado</strong></td>
<td>Media</td>
<td>Medio</td>
<td>El bootstrap inyecta desde ámbito de Usuario automáticamente</td>
</tr>
<tr>
<td><strong>Cambio de API del LLM</strong></td>
<td>Baja</td>
<td>Alto</td>
<td>Semantic Kernel abstrae el proveedor; migrar de OpenAI → AzureOpenAI es 1 línea de configuración</td>
</tr>
<tr>
<td><strong>Skill description ambigua</strong></td>
<td>Media</td>
<td>Medio</td>
<td>Convención de naming documentada; few-shot en el prompt</td>
</tr>
<tr>
<td><strong>Flaky tests por UI</strong></td>
<td>Media</td>
<td>Medio</td>
<td>Pasos directos para validaciones críticas; <code>BrowserSkill</code> como complemento, no como base</td>
</tr>
<tr>
<td><strong>Adopción sin capacitación</strong></td>
<td>Alta</td>
<td>Alto</td>
<td>Plan de onboarding + documentación normativa incluida en el repo</td>
</tr>
</tbody>
</table>
</section>

<h1 id="riesgos-profundidad-t%C3%A9cnica">Riesgos: Profundidad Técnica</h1>
<div class="columns">
<div>
<p><strong>Dependencia del LLM</strong></p>
<ul>
<li>El orquestador IA puede fallar si el modelo no está disponible</li>
<li><strong>Mitigación:</strong> Los pasos de base de datos son 100% deterministas y no dependen del LLM. Los casos críticos de negocio se prueban con <code>DatabaseStepDefinitions</code>, no con IA.</li>
</ul>
<p><strong>Costo de tokens</strong></p>
<ul>
<li>1 escenario IA ≈ ~300–500 tokens input + ~50 output</li>
<li>gpt-4o: ~$0.005 por escenario</li>
<li>Con 100 escenarios diarios en CI ≈ $0.50/día</li>
<li><strong>Mitigación:</strong> Taggear con <code>@ai</code> solo los escenarios que realmente necesitan IA</li>
</ul>
</div>
<div>
<p><strong>Seguridad</strong></p>
<ul>
<li>Los secrets en <code>appsettings.json</code> son <strong>solo placeholders</strong></li>
<li>En CI/CD se inyectan por variables de entorno del pipeline</li>
<li>AWS SSO garantiza credenciales temporales (TTL 8h)</li>
<li>El template incluye <code>AwsConnectionTest</code> para validar la sesión antes de ejecutar</li>
</ul>
<p><strong>Mantenimiento del prompt</strong></p>
<ul>
<li>Si se agregan nuevas skills, el few-shot del prompt debe actualizarse</li>
<li><strong>Mitigación:</strong> <code>available_skills</code> se inyecta dinámicamente desde los plugins registrados en el kernel; el prompt template está en disco, versionado en Git</li>

</tr>
<tr>
<td><strong>Fase 1: Piloto</strong></td>
<td>2–4 semanas</td>

<td>80% de los smoke tests automatizados</td>
</tr>
<tr>

</tr>
<tr>

<td>Ongoing</td>

</tr>
</tbody>
</table>
<p><strong>Prerequisitos para Fase 0:</strong></p>

</ul>

<h1 id="modelo-de-mantenimiento">Modelo de Mantenimiento</h1>
<div class="columns">
<div>
<p><strong>Responsabilidades del equipo dueño del template:</strong></p>
<ul>
<li>Actualizar versiones de paquetes (semestral o cuando hay CVE)</li>
<li>Agregar nuevas skills al catálogo base</li>
<li>Mantener la documentación normativa (<code>prompts/</code>)</li>
<li>Publicar el <code>bootstrap-template.ps1</code> actualizado</li>
<li>Resolver dependencias del feed privado <code>gbmWallE</code></li>
</ul>
<p><strong>Responsabilidades de cada equipo adoptante:</strong></p>
<ul>
<li>Configurar <code>appsettings.json</code> para su ambiente</li>
<li>Agregar sus propios features y steps específicos del dominio</li>
<li>Mantener sus secrets en AWS Secrets Manager</li>
<li>Reportar problemas o mejoras al equipo dueño</li>
</ul>
</div>
<div>
<p><strong>Versionado del template:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>bootstrap-template.ps1  ─────────────────────
                              │
                    v1.0  v1.1  v2.0
                       │     │     │
                    -Force para proyectos
                    que quieren migrar
                    a una versión nueva
</code></pre>
<p><strong>Evolución de skills:</strong></p>
<p>Agregar una skill nueva no rompe proyectos existentes. El bootstrap es <strong>aditivo</strong>: solo añade archivos, nunca modifica los existentes sin <code>-Force</code>.</p>
</div>
</div>
</section>
